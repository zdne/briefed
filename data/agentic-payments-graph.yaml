meta:
  title: Agentic Payments Knowledge Graph
  as_of: 2026-07-27
  schema_version: 1
  scope:
    - commerce
    - machine_payments
    - treasury
    - currency
  relationship_statuses:
    live: "●"
    limited: "◐"
    announced: "○"
    planned: "~"
    reference: ""
  notes:
    - "The graph records positive, source-backed relationships. It does not treat an absent relationship as a fact."
    - "Status qualifies a relationship or claim, not necessarily the company or protocol as a whole."
    - "Company marketing claims are recorded as claims_support_for unless implementation documentation establishes a stronger relationship."

taxonomy:
  flows:
    - { id: shared_standards_trust, name: Shared standards and trust }
    - { id: commerce, name: Agentic commerce }
    - { id: machine_payments, name: Agentic machine payments }
    - { id: treasury, name: Agentic treasury }
    - { id: currency, name: Currency and settlement }
  memberships:
    shared_standards_trust: [mcp, agentic_ai_foundation, web_bot_auth, http_message_signatures, ap2, visa_tap, mastercard_agent_pay, sardine, forter, linux_foundation, x402_foundation, anthropic, ietf, fido_alliance, webbotauth_working_group, fido_payments_working_group, cloudflare, aws, akamai]
    commerce: [acp, ucp, shared_payment_token, chatgpt, gemini, google_ai_mode, shopify_storefront_mcp, shopify_agentic_storefronts, instant_checkout, adyen_agentic, paypal_agent_ready, visa_intelligent_commerce, visa_agentic_ready, mastercard_agent_pay, alchemy_agentcard, marqeta_jit_funding, marqeta_commando_mode, arc_pay, reap, crossmint_agentic_payments, microsoft_dynamics365_commerce_mcp_server, cloudflare_programmable_wallets, axlabs, ax402, openai, stripe, google, shopify, ulta, adyen, paypal, mastercard, american_express, marqeta, alchemy, visa]
    machine_payments: [x402, mpp, tempo, coinbase_agentic_market, coinbase_agentic_wallets, crossmint_agentic_payments, reap, mastercard_agentic_token_framework, exaai_labs, coinbase]
    treasury: [meow, griffin, circle_mint, jpmorgan_payments, mirakl]
    currency: [usdc, open_usd, visa_rail, mastercard_rail, arc_pay, reap, crossmint_agentic_payments, cloudflare_stablecoin_wallet, agentcard_sh, arc_testnet, circle, open_standard, ach, wire_transfer, crossmint]

