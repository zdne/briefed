services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pnd
      POSTGRES_USER: pnd
      POSTGRES_PASSWORD: pnd
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pnd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnd -d pnd"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pnd:pnd@postgres:5432/pnd
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pnd_postgres:
