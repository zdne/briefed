name: Daily Digest

on:
  schedule:
    - cron: "0 4 * * *" # 6am CET/CEST
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Skip sync/digest/publish — dry-run the workflow shell without touching the archive or the paidbyagent-site repo"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "daily-digest"
  cancel-in-progress: false

env:
  # Credentials / personal data — Secrets (masked in logs)
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  TWITTERAPI_IO_API_KEY: ${{ secrets.TWITTERAPI_IO_API_KEY }}
  REDDIT_RSS_USER: ${{ secrets.REDDIT_RSS_USER }}
  REDDIT_RSS_FEED: ${{ secrets.REDDIT_RSS_FEED }}
  # Non-sensitive tuning values / model names — Variables (not masked; avoids
  # false-positive redaction of unrelated digit strings, e.g. tweet IDs, that
  # happen to contain the same digits as a small numeric secret)
  PG_POOL_MAX: ${{ vars.PG_POOL_MAX }}
  OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
  OPENAI_LLM_MODEL: ${{ vars.OPENAI_LLM_MODEL }}
  ANTHROPIC_LLM_MODEL: ${{ vars.ANTHROPIC_LLM_MODEL }}
  GMAIL_MAX_MESSAGES: ${{ vars.GMAIL_MAX_MESSAGES }}
  TWITTERAPI_IO_BASE_URL: ${{ vars.TWITTERAPI_IO_BASE_URL }}
  TWITTERAPI_LIST_MAX_PAGES: ${{ vars.TWITTERAPI_LIST_MAX_PAGES }}
  TWITTERAPI_LIST_MAX_TWEETS: ${{ vars.TWITTERAPI_LIST_MAX_TWEETS }}
  RSS_FETCH_DELAY_MS: ${{ vars.RSS_FETCH_DELAY_MS }}
  RSS_REDDIT_FETCH_DELAY_MS: ${{ vars.RSS_REDDIT_FETCH_DELAY_MS }}
  RSS_MAX_ITEMS_PER_FEED: ${{ vars.RSS_MAX_ITEMS_PER_FEED }}
  RSS_USER_AGENT: ${{ vars.RSS_USER_AGENT }}
  RSS_REQUEST_TIMEOUT_MS: ${{ vars.RSS_REQUEST_TIMEOUT_MS }}
  REDDIT_ENRICHMENT_MODE: ${{ vars.REDDIT_ENRICHMENT_MODE }}
  ENRICHMENT_TOPIC_UPGRADE_THRESHOLD: ${{ vars.ENRICHMENT_TOPIC_UPGRADE_THRESHOLD }}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Write briefed.config.json from secret
        if: ${{ !inputs.skip_sync }}
        run: printf '%s' "$BRIEFED_CONFIG_JSON" > briefed.config.json
        env:
          BRIEFED_CONFIG_JSON: ${{ secrets.BRIEFED_CONFIG_JSON }}

      - name: Sync sources
        if: ${{ !inputs.skip_sync }}
        run: npx tsx src/cli.ts sync --hours 24 || true

      - name: Generate friendly digest
        if: ${{ !inputs.skip_sync }}
        run: npx tsx src/cli.ts digest --friendly

      # briefed only ever produces the post's Markdown + front matter; all
      # rendering (Eleventy, templates, CSS) happens in paidbyagent-site's
      # own deploy.yml, triggered by the push below. See docs/HowItWorks.md's
      # "Publishing to paidbyagent.com" section for the content-contract
      # details between the two repos.
      - name: Checkout site repo
        if: ${{ !inputs.skip_sync }}
        uses: actions/checkout@v4
        with:
          repository: zdne/paidbyagent-site
          token: ${{ secrets.SITE_REPO_PAT }}
          path: site-repo

      - name: Prepare post
        if: ${{ !inputs.skip_sync }}
        run: node .github/scripts/prepare-post.mjs
        env:
          SITE_POSTS_DIR: site-repo/site/posts

      - name: Publish post to site repo
        if: ${{ !inputs.skip_sync }}
        run: |
          cd site-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/posts
          git diff --cached --quiet || git commit -m "Add briefing for $(date -u +%Y-%m-%d)"
          git push
