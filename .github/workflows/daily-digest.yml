name: Daily Digest

on:
  schedule:
    - cron: "0 4 * * *" # 6am CET/CEST
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Skip sync/digest generation — just rebuild and redeploy the site from what's already committed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Credentials / personal data — Secrets (masked in logs)
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  TWITTERAPI_IO_API_KEY: ${{ secrets.TWITTERAPI_IO_API_KEY }}
  REDDIT_RSS_USER: ${{ secrets.REDDIT_RSS_USER }}
  REDDIT_RSS_FEED: ${{ secrets.REDDIT_RSS_FEED }}
  # Non-sensitive tuning values / model names — Variables (not masked; avoids
  # false-positive redaction of unrelated digit strings, e.g. tweet IDs, that
  # happen to contain the same digits as a small numeric secret)
  PG_POOL_MAX: ${{ vars.PG_POOL_MAX }}
  OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
  OPENAI_LLM_MODEL: ${{ vars.OPENAI_LLM_MODEL }}
  ANTHROPIC_LLM_MODEL: ${{ vars.ANTHROPIC_LLM_MODEL }}
  GMAIL_MAX_MESSAGES: ${{ vars.GMAIL_MAX_MESSAGES }}
  TWITTERAPI_IO_BASE_URL: ${{ vars.TWITTERAPI_IO_BASE_URL }}
  TWITTERAPI_LIST_MAX_PAGES: ${{ vars.TWITTERAPI_LIST_MAX_PAGES }}
  TWITTERAPI_LIST_MAX_TWEETS: ${{ vars.TWITTERAPI_LIST_MAX_TWEETS }}
  RSS_FETCH_DELAY_MS: ${{ vars.RSS_FETCH_DELAY_MS }}
  RSS_REDDIT_FETCH_DELAY_MS: ${{ vars.RSS_REDDIT_FETCH_DELAY_MS }}
  RSS_MAX_ITEMS_PER_FEED: ${{ vars.RSS_MAX_ITEMS_PER_FEED }}
  RSS_USER_AGENT: ${{ vars.RSS_USER_AGENT }}
  RSS_REQUEST_TIMEOUT_MS: ${{ vars.RSS_REQUEST_TIMEOUT_MS }}
  REDDIT_ENRICHMENT_MODE: ${{ vars.REDDIT_ENRICHMENT_MODE }}
  ENRICHMENT_TOPIC_UPGRADE_THRESHOLD: ${{ vars.ENRICHMENT_TOPIC_UPGRADE_THRESHOLD }}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Write briefed.config.json from secret
        if: ${{ !inputs.skip_sync }}
        run: printf '%s' "$BRIEFED_CONFIG_JSON" > briefed.config.json
        env:
          BRIEFED_CONFIG_JSON: ${{ secrets.BRIEFED_CONFIG_JSON }}

      - name: Sync sources
        if: ${{ !inputs.skip_sync }}
        run: npx tsx src/cli.ts sync --hours 24 || true

      - name: Generate friendly digest
        if: ${{ !inputs.skip_sync }}
        run: npx tsx src/cli.ts digest --friendly

      - name: Prepare post
        if: ${{ !inputs.skip_sync }}
        run: node .github/scripts/prepare-post.mjs

      - name: Stage post artifact
        # Grabs the exact file prepare-post.mjs just wrote (it's the only
        # untracked change under site/posts at this point) so the
        # publish-to-site-repo job doesn't have to re-derive today's date
        # itself and risk a UTC-boundary mismatch.
        if: ${{ !inputs.skip_sync }}
        run: |
          FILE=$(git status --porcelain site/posts | awk '{print $2}')
          mkdir -p /tmp/post-artifact
          cp "$FILE" /tmp/post-artifact/

      - name: Upload post artifact
        if: ${{ !inputs.skip_sync }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-post
          path: /tmp/post-artifact
          retention-days: 1

      - name: Commit archive
        if: ${{ !inputs.skip_sync }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/posts
          git diff --cached --quiet || git commit -m "Add briefing for $(date -u +%Y-%m-%d)"
          git push

      - name: Build site
        run: npm run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/_site

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Phase 1 of the briefed/paidbyagent.com split: publishes the day's post to
  # the new paidbyagent-site repo in addition to (not instead of) the steps
  # above, so this repo's own live Pages deploy is never put at risk while
  # the new repo is being tested. Runs independently of `deploy` (both only
  # depend on `digest`) so a failure here never blocks the existing pipeline.
  # See docs/HowItWorks.md and the paidbyagent-site repo's README for the
  # front-matter "content contract" between the two repos.
  publish-to-site-repo:
    needs: digest
    if: ${{ !inputs.skip_sync }}
    runs-on: ubuntu-latest
    steps:
      - name: Download post artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-post
          path: incoming-post

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: zdne/paidbyagent-site
          token: ${{ secrets.SITE_REPO_PAT }}
          path: site-repo

      - name: Publish post to site repo
        run: |
          mkdir -p site-repo/site/posts
          cp incoming-post/*.md site-repo/site/posts/
          cd site-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/posts
          git diff --cached --quiet || git commit -m "Add briefing for $(date -u +%Y-%m-%d)"
          git push
